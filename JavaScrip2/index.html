<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
    <link rel="stylesheet" href="../JavaScrip2/estilos/estilos.css">

</head>

<body>

    <main class="calculadora">

        <header class="encabezado">
            <h1>calculadora</h1>
        </header>
     

        <form id="formCalculadora">

        <div class="campo">
          <label for="numero1">
            <span class="numero uno">1</span>
            Ingrese el numero 1
          </label>

          <input type="number" id="numero1" required>
        </div>

        <div class="campo">
          <label for="numero2">
            <span class="numero dos">2</span>
            Ingrese el numero 2
          </label>

          <input type="number" id="numero2" required>
        </div>

        <div class="boton-cont">
          <input type="submit" value="Realizar calculo">
        </div>

        <section class="panel">
            <h3>Mostrando calculo Realizado</h3>
            <div id="resultado"></div>
        </section>

     </form>


    </main>

    <script src="../JavaScrip2/JS/tarea.js"></script>
    
</body>
</html>
