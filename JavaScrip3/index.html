<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Configuración del documento y enlace a la hoja de estilos. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
    <link rel="stylesheet" href="">

</head>

<body>

    <!-- Contenedor principal de la calculadora. -->
    <main class="calculadora">

        <!-- Título de la calculadora de raíces cuadráticas. -->
        <header class="encabezado">
            <h1>Calculadora de raiz cuadratica</h1>
        </header>
     

        <!-- Formulario para ingresar los coeficientes de la ecuación. -->
        <form id="formCalculadora">

        <!-- Primer coeficiente. -->
        <div class="campo">
          <label for="numero1">
            <span class="numero uno">1</span>
            Ingrese el numero 1
          </label>

          <input type="number" id="numero1" required>
        </div>

        <!-- Segundo coeficiente. -->
        <div class="campo">
          <label for="numero2">
            <span class="numero dos">2</span>
            Ingrese el numero 2
          </label>

          <input type="number" id="numero2" required>
        </div>

        <!-- Tercer coeficiente. -->
        <div class="campo">
          <label for="numero3">
            <span class="numero tres">3</span>
            Ingrese el numero 3
          </label>

          <input type="number" id="numero3" required>
        </div>

        <!-- Envía los coeficientes para realizar el cálculo. -->
        <div class="boton-cont">
          <input type="submit" value="Realizar calculo">
        </div>

        <!-- Área donde se muestra el cálculo realizado. -->
        <section class="panel">
            <h3>Mostrando calculo Realizado</h3>
            <div id="resultado"></div>
        </section>

     </form>


    </main>

    <!-- Carga la lógica de la calculadora. -->
    <script src="../JavaScrip3/JS/trabajoencalse.js"></script>
    
</body>
</html>
